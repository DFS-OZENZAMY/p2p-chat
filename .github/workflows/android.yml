name: APK Android

on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle/**", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé de debug."
          fi

      - name: Construire l'APK
        env:
          DIRECTORY_URL: ${{ vars.DIRECTORY_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: p2pchat
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY_URL: ${{ vars.DIRECTORY_URL }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk p2p-chat.apk
          TAG="v0.1.${{ github.run_number }}"
          NOTE="APK Android de P2P Chat (commit ${GITHUB_SHA::7})."
          if [ -z "$DIRECTORY_URL" ]; then
            NOTE="$NOTE ⚠ Aucun serveur annuaire configuré (variable DIRECTORY_URL) : l'inscription ne fonctionnera pas encore."
          fi
          gh release create "$TAG" p2p-chat.apk --title "P2P Chat $TAG" --notes "$NOTE" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: p2p-chat-apk
          path: p2p-chat.apk
