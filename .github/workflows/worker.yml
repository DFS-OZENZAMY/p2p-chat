name: Déployer l'annuaire (Cloudflare)

# Lancement manuel : onglet Actions > « Déployer l'annuaire » > Run workflow.
# Nécessite les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Base de données D1
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="p2p-chat");process.stdout.write(d?d.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create p2p-chat; ID=$(find_id); fi
          echo "D1 : $ID"
          sed -i "s/REMPLACE_PAR_TON_ID/$ID/" wrangler.toml
          npx wrangler d1 execute p2p-chat --remote --file=schema.sql

      - name: Déployer le Worker
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### Annuaire déployé"
            echo ""
            echo "Adresse : \`$URL\`"
            echo ""
            echo "Mets-la dans Settings > Secrets and variables > Actions > Variables > \`DIRECTORY_URL\`, puis relance les workflows « APK Android » et « Site et app web »."
          } >> "$GITHUB_STEP_SUMMARY"
