name: Site et app web

# Assemble site/ + web/ et publie le résultat sur la branche gh-pages (source de GitHub Pages).
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        env:
          DIRECTORY_URL: ${{ vars.DIRECTORY_URL }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r web/. _site/app/
          node -e 'const fs=require("fs");fs.writeFileSync("_site/app/config.js","window.P2P_CONFIG = "+JSON.stringify({directoryUrl:process.env.DIRECTORY_URL||""})+";\n")'
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/app/sw.js
          grep -rl "__REPO__" _site | xargs -r sed -i "s#__REPO__#$REPO#g"
          touch _site/.nojekyll

      - name: Publier sur gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
